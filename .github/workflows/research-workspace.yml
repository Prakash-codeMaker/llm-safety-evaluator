name: Research workspace checks

on:
  push:
    branches: ["faculty-collaboration-lab"]
    paths:
      - "research_lab/**"
      - "requirements-research.txt"
      - "Makefile"
      - ".github/workflows/research-workspace.yml"
  pull_request:
    paths:
      - "research_lab/**"
      - "requirements-research.txt"
      - "Makefile"
      - ".github/workflows/research-workspace.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-research.txt
      - run: python -m pytest research_lab/tests -q
      - run: python -m research_lab.run_all
