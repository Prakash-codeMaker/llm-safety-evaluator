name: Research discussion request
description: Request a short academic discussion about a proposed research direction.
title: "[Research discussion]: "
labels: ["research-discussion"]
body:
  - type: input
    id: name
    attributes:
      label: Name and affiliation
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Institutional email
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Research direction
      options:
        - Robotics and imitation learning
        - Trustworthy AI evaluation
        - Scientific machine learning
        - Other / interdisciplinary
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Research question or proposed discussion
    validations:
      required: true
