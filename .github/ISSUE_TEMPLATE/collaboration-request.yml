name: Research discussion request
description: Start a public research discussion about one of the reproducible directions.
title: "[Research discussion]: "
labels: ["research-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not post private contact details, unpublished datasets, credentials, or confidential university information in a public issue. For a private conversation, email p9340297@gmail.com.
  - type: input
    id: affiliation
    attributes:
      label: Name and affiliation (optional)
  - type: dropdown
    id: direction
    attributes:
      label: Research direction
      options:
        - Robotics and imitation learning
        - Trustworthy AI evaluation
        - Scientific machine learning
        - Other / interdisciplinary
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Research question or proposed discussion
    validations:
      required: true
